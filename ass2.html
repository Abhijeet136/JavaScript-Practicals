
<!DOCTYPE html>
<html>
<head>
    <title>Multiplication Tables</title>
</head>
<body>

    <h1>Multiplication Table Generator</h1>

    <h3>For Loop</h3>
    <input type="number" id="num1" placeholder="Enter first number">
    <button onclick="forLoop()">Generate</button>
    <button onclick="resetFor()">Reset</button>
    <p id="result1"></p>

    <h3>While Loop</h3>
    <input type="number" id="num2" placeholder="Enter second number">
    <button onclick="whileLoop()">Generate</button>
    <p id="result2"></p>

    <h3>Do-While Loop</h3>
    <input type="number" id="num3" placeholder="Enter third number">
    <button onclick="doWhileLoop()">Generate</button>
    <p id="result3"></p>

    <script>

        // For Loop
        function forLoop() {
            let n = Number(document.getElementById("num1").value);
            let output = "";

            for (let i = 1; i <= 10; i++) {
                output += n + " x " + i + " = " + (n * i) + "<br>";
            }

            document.getElementById("result1").innerHTML = output;
        }


        // While Loop
        function whileLoop() {
            let n = Number(document.getElementById("num2").value);
            let i = 1;
            let output = "";

            while (i <= 10) {
                output += n + " x " + i + " = " + (n * i) + "<br>";
                i++;
            }

            document.getElementById("result2").innerHTML = output;
        }


        // Do-While Loop
        function doWhileLoop() {
            let n = Number(document.getElementById("num3").value);
            let i = 1;
            let output = "";

            do {
                output += n + " x " + i + " = " + (n * i) + "<br>";
                i++;
            } while (i <= 10);

            document.getElementById("result3").innerHTML = output;
        }

        function resetFor(){
            document.getElementById("num1").value=' ';
        }

    </script>

</body>
</html>
