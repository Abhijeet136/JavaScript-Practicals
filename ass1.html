<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Assignment 1 - Area Calculator</title>
</head>
<!-- HTML -->
<body>
  
    <h1>Area Calculator</h1>
    <h2>Triangle</h2>
      <input id="side1" type="number" placeholder="Side 1">
      <input id="side2" type="number" placeholder="Side 2">
      <input id="side3" type="number" placeholder="Side 3">
      <button onclick="triangleArea()">Calculate</button>
      <button onclick="resetTriangle()">Reset Triangle</button>
      <p id="triangleResult" class="result"></p>
    
    <h2>Rectangle</h2><input id="length" type="number" placeholder="Length"><input id="width" type="number" placeholder="Width"><button onclick="rectangleArea()">Calculate</button><button onclick="resetRectangle()">Reset Rectangle</button><p id="rectangleResult" class="result"></p>
    <h2>Circle</h2><input id="radius" type="number" placeholder="Radius"><button onclick="circleArea()">Calculate</button><button onclick="resetCircle()">Reset Circle</button><p id="circleResult" class="result"></p>
    <button onclick="resetAll()">Reset</button>
 
  <!-- JavaScript -->
  <script>
    function number(id) { return Number(document.getElementById(id).value); }
    function triangleArea() { const a=number('side1'), b=number('side2'), c=number('side3'); const r=document.getElementById('triangleResult'); if(a<=0||b<=0||c<=0||a+b<=c||a+c<=b||b+c<=a){r.innerHTML='Enter three valid triangle sides.';return;} const s=(a+b+c)/2; r.innerHTML='Area: '+Math.sqrt(s*(s-a)*(s-b)*(s-c)).toFixed(2)+' sq. units'; }
    function rectangleArea() { const l=number('length'), w=number('width'); document.getElementById('rectangleResult').textContent=l>0&&w>0?'Area: '+(l*w).toFixed(2)+' sq. units':'Enter valid length and width.'; }
    function circleArea() { const r=number('radius'); document.getElementById('circleResult').textContent=r>0?'Area: '+(Math.PI*r*r).toFixed(2)+' sq. units':'Enter a valid radius.'; }
    function resetTriangle() { ['side1','side2','side3'].forEach(id=>document.getElementById(id).value=''); triangleResult.textContent=''; }
    function resetRectangle() { ['length','width'].forEach(id=>document.getElementById(id).value=''); rectangleResult.textContent=''; }
    function resetCircle() { radius.value=''; circleResult.textContent=''; }
    function resetAll(){
      resetCircle();
      resetRectangle();
      resetTriangle();
    }
  </script>
</body>
</html>
