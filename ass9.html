
<!DOCTYPE html>
<html>
<head>
    <title>Student Information Form</title>
</head>

<body>

    <h1>Student Information Form</h1>

    <p>Enter your information and submit the form.</p>

    <form id="studentForm" onsubmit="submitForm(event)">

        <h2>1. Student Name</h2>

        <label>Full Name</label>
        <input type="text" id="name"
               placeholder="Enter your full name" required>


        <h2>2. Address</h2>

        <label>Address</label>
        <textarea id="address"
                  placeholder="Enter your address"
                  required></textarea>


        <h2>3. City and State</h2>

        <label>City</label>
        <input type="text" id="city"
               placeholder="Enter city" required>

        <br><br>

        <label>State</label>
        <input type="text" id="state"
               placeholder="Enter state" required>


        <h2>4. Gender</h2>

        <input type="radio" name="gender" value="Male" required>
        Male

        <input type="radio" name="gender" value="Female">
        Female

        <input type="radio" name="gender" value="Other">
        Other


        <h2>5. Mobile Number</h2>

        <label>Mobile Number</label>
        <input type="tel" id="mobile"
               placeholder="Enter 10-digit mobile number"
               pattern="[0-9]{10}"
               maxlength="10" required>


        <h2>6. Email ID</h2>

        <label>Email ID</label>
        <input type="email" id="email"
               placeholder="example@gmail.com" required>

        <br><br>

        <button type="submit">Submit Information</button>

        <button type="button" onclick="resetForm()">Reset</button>

    </form>


    <!-- Submission Result -->

    <div id="result"></div>


    <script>

        function submitForm(event) {

            event.preventDefault();

            // Get form values

            let name = document.getElementById("name").value;
            let address = document.getElementById("address").value;
            let city = document.getElementById("city").value;
            let state = document.getElementById("state").value;
            let mobile = document.getElementById("mobile").value;
            let email = document.getElementById("email").value;

            let gender = document.querySelector(
                'input[name="gender"]:checked'
            ).value;


            // Display congratulations message

            document.getElementById("result").innerHTML =
                "<h2>Congratulations!</h2>" +
                "<h3>Student Information Submitted Successfully!</h3>"+
                 "Student Name: " + name + '<br>' +
                "Address: " + address + '<br>' +
                "City: " + city + "\n" +
                "State: " + state + "\n" +
                "Gender: " + gender + "\n" +
                "Mobile Number: " + mobile + "\n" +
                "Email ID: " + email;


            // Display all submitted information

            // let details =
            //     "Student Name: " + name + "\n" +
            //     "Address: " + address + "\n" +
            //     "City: " + city + "\n" +
            //     "State: " + state + "\n" +
            //     "Gender: " + gender + "\n" +
            //     "Mobile Number: " + mobile + "\n" +
            //     "Email ID: " + email;

            // let output = document.createElement("pre");

            // output.textContent = details;

            // document.getElementById("result").appendChild(output);
        }


        // Reset Form

        function resetForm() {

            document.getElementById("studentForm").reset();

            document.getElementById("result").innerHTML = "";
        }

    </script>

</body>
</html>
